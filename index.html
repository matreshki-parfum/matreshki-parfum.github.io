<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5EFE5">
<title>Матрешки — парфюм распив</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5EFE5;--card:#FFFCF7;--text:#3A2527;--muted:#796A63;--line:#E6D5B8;--gold:#8B2635;--champagne:#E6D5B8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Manrope",sans-serif}
header{padding:28px 18px 20px;text-align:center;border-bottom:1px solid var(--line);background:rgba(255,252,247,.65)}
.logo{font-family:"Cormorant Garamond",serif;font-size:42px;font-weight:700;letter-spacing:5px;color:var(--text);line-height:1}
.subtitle{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--gold);margin-top:10px;text-transform:uppercase}
main{max-width:900px;margin:auto;padding:20px 15px 45px}
.intro{font-family:"Cormorant Garamond",serif;font-size:25px;margin:8px 0}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 20px}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:13px;font-size:14px;font-family:"Manrope",sans-serif;outline:none;box-shadow:0 2px 8px rgba(58,37,39,.03)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 5px 18px rgba(58,37,39,.05)}
.product img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#EDE2D3;display:block}
.product-info{padding:12px}
.brand{font-size:10px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
.name{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:22px;margin:7px 0;color:var(--text)}
.desc{font-size:12px;color:var(--muted);line-height:1.45;min-height:20px;white-space:pre-wrap}
.price{font-size:15px;margin:12px 0}
  .atomizer-note{
  font-size:11px;
  color:var(--muted);
  line-height:1.4;
  margin:-5px 0 10px;
}
button,.buy{border:1px solid var(--gold);background:var(--gold);color:#FFFCF7;padding:12px 10px;border-radius:9px;font-family:"Manrope",sans-serif;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;font-size:13px;display:block;width:100%;transition:background .2s,transform .2s}button:hover,.buy:hover{background:#70202C;transform:translateY(-1px)}
.empty{padding:30px 10px;text-align:center;color:var(--muted);grid-column:1/-1}
footer{text-align:center;padding:25px 10px;color:var(--muted);font-size:11px;letter-spacing:1.5px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding-top:30px}.logo{font-size:48px}}
</style>
</head>
<body>
<header>
  <div class="logo">МАТРЕШКИ</div>
  <div class="subtitle">ПАРФЮМ РАСПИВ</div>
</header>
<main>
  <div class="note">Знакомьтесь с ассортиментом, выбирайте ароматы и изучайте доступные объёмы и стоимость за миллилитр.<br><br>Для оформления заказа или уточнения наличия нажмите «Уточнить и купить» и свяжитесь с администратором.</div>  <input id="search" placeholder="⌕  Поиск аромата или бренда">
  <div class="filters">
    <select id="sort">
      <option value="default">Без сортировки</option>
      <option value="low">Сначала дешевле</option>
      <option value="high">Сначала дороже</option>
      <option value="az">По названию</option>
    </select>
  </div>
  <div class="grid" id="products"><div class="empty">Загружаем каталог…</div></div>
</main>
<footer>МАТРЕШКИ · ПАРФЮМ РАСПИВ</footer>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxiUdZ0WWrmMz5ZNviCajKP7op4HuKkH88ay2fJpjsSycw_24vRQnR_Hak2cYyz-IvbTQ/exec";
const MANAGERS = {
  ciaonatalie: "https://t.me/ciaonatalie",
  hellonatalii: "https://t.me/hellonatalii"
};
let products = [];
const placeholder = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500"><rect width="100%" height="100%" fill="#F5EFE5"/><text x="50%" y="47%" fill="#8B2635" text-anchor="middle" font-family="Georgia" font-size="28">МАТРЕШКИ</text><text x="50%" y="54%" fill="#aaa" text-anchor="middle" font-size="12" letter-spacing="4">ПАРФЮМ</text></svg>`);

function managerUrl(manager) {
  if (String(manager).includes('http')) return String(manager);
  return MANAGERS[String(manager || '').replace('@','')] || MANAGERS.ciaonatalie;
}
function normalizeProduct(p) {
  const legacy = String(p.volumes || '').match(/(\d+(?:[.,]\d+)?)\s*мл\s*[-–—:]\s*(\d+)\s*(?:р|₽)/i);
  const perMl = Number(p.price_per_ml);
  return {
    id: p.id,
    brand: String(p.brand || 'Матрешки Парфюм'),
    name: String(p.name || 'Без названия'),
    category: String(p.category || ''),
    description: String(p.description || ''),
    pricePerMl: Number.isFinite(perMl) && perMl > 0 ? perMl : (legacy ? Number(legacy[2]) / Number(legacy[1].replace(',', '.')) : 0),
    stockMl: Number(p.stock_ml || 0),
    legacyVolumes: String(p.volumes || ''),
    manager: String(p.manager || 'ciaonatalie'),
    image: typeof p.photo === 'string' && /^https?:\/\//i.test(p.photo) ? p.photo : (typeof p.image === 'string' ? p.image : ''),
    active: p.active === true || String(p.active) === '1' || String(p.active).toLowerCase() === 'true'
  };
}
async function loadCatalog() {
  const root = document.getElementById('products');
  try {
    const response = await fetch(API_URL, {cache:'no-store'});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (!data.ok || !Array.isArray(data.products)) throw new Error(data.error || 'Неверный ответ API');
    products = data.products.map(normalizeProduct).filter(p => p.active);
  } catch (error) {
    console.error('Не удалось загрузить общий каталог:', error);
    root.innerHTML = '<div class="empty">Не удалось загрузить каталог. Обнови страницу чуть позже.</div>';
    return;
  }
  render();
}
function render() {
 const q = document.getElementById('search').value.trim().toLowerCase();
 const sort = document.getElementById('sort').value;
let list = products.filter(p => (p.name+' '+p.brand+' '+p.description).toLowerCase().includes(q)); if(sort==='low') list.sort((a,b)=>a.pricePerMl-b.pricePerMl);
 if(sort==='high') list.sort((a,b)=>b.pricePerMl-a.pricePerMl);
 if(sort==='az') list.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
 const root = document.getElementById('products');
 root.innerHTML = '';
 if(!list.length) { root.innerHTML='<div class="empty">Пока нет опубликованных ароматов. Скоро здесь появятся новинки.</div>'; return; }
 list.forEach(p => {
  const card = document.createElement('article'); card.className='product';
  const img = document.createElement('img'); img.src=p.image||placeholder; img.alt=p.brand+' '+p.name;
  img.onerror=()=>{img.onerror=null;img.src=placeholder;};
  const info=document.createElement('div'); info.className='product-info';
  const brand=document.createElement('div'); brand.className='brand'; brand.textContent=p.brand;
  const name=document.createElement('div'); name.className='name'; name.textContent=p.name;
  const desc=document.createElement('div'); desc.className='desc'; desc.textContent=p.description;
  const price=document.createElement('div'); price.className='price'; price.textContent=p.pricePerMl>0 ? p.pricePerMl.toLocaleString('ru-RU')+' ₽ / мл' : 'Цена уточняется';
   const atomizer=document.createElement('div');
atomizer.className='atomizer-note';
atomizer.textContent='Атомайзер оплачивается отдельно';
  const stock=document.createElement('div'); stock.className='desc'; stock.textContent=p.stockMl>0 ? 'В наличии: '+p.stockMl.toLocaleString('ru-RU')+' мл' : (p.legacyVolumes || 'Остаток уточняйте у администратора');
  const buy=document.createElement('button'); buy.className='buy'; buy.textContent='Уточнить и купить';
  buy.addEventListener('click',()=>{
  const message = `Здравствуйте! Хочу уточнить наличие аромата ${p.brand} — ${p.name} и оформить заказ.`;
  const url = managerUrl(p.manager);
  const separator = url.includes('?') ? '&' : '?';
  window.open(url + separator + 'text=' + encodeURIComponent(message), '_blank', 'noopener');
});
  info.append(brand,name,desc,price,atomizer,stock,buy); card.append(img,info); root.append(card);
 });
}
['search','sort'].forEach(id => {
  document.getElementById(id).addEventListener(
    id === 'search' ? 'input' : 'change',
    render
  );
});loadCatalog();
</script>
</body>
</html>
<!-- refresh pages -->
